name: CI

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt
  
      - name: Run tests
        run: python -m pytest tests -v
   
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Build Docker image
        run: docker build -t flightplanner .  

      - name: Check API container startup
        run: |
          docker run -d --name flightplanner-api -p 8000:8000 flightplanner
          trap 'docker logs flightplanner-api; docker rm -f flightplanner-api' EXIT
          # Docker can reset connections while Uvicorn is still starting.
          curl --fail --show-error --retry 30 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:8000/health
